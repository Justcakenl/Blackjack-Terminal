[package]
name = "blackjack-tui"
version = "0.1.0"
edition = "2021"
description = "A terminal blackjack game"
license = "MIT"
default-run = "bljack"

[[bin]]
name = "bljack"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
directories = "6"
rand = "0.9"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.clippy]
all = "warn"

[package.metadata.arch]
package = "blackjack-tui"
